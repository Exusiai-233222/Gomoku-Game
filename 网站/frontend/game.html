<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>五子棋对战 · 游戏平台</title>
    <link rel="stylesheet" href="css/style.css" />
    <style>
      /* 针对五子棋的局部样式 */
      .game-container {
        display: flex;
        justify-content: center;
        margin-top: 20px;
      }
      canvas {
        background-color: #dcb35c;
        border-radius: 8px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        cursor: pointer;
      }
      .info-panel {
        display: flex;
        gap: 20px;
        font-size: 20px;
        margin-bottom: 15px;
        justify-content: center;
      }
      .highlight {
        color: #ffcc00;
        font-weight: bold;
      }
      .danger {
        color: #ff4444;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="game.html"
        ><span class="brand-mark"></span>五子棋对战</a
      >
      <nav class="nav">
        <a href="game.html" class="active">游戏</a>
        <a href="leaderboard.html">排行榜</a>
        <a href="profile.html">我的</a>
      </nav>
      <div class="user-chip">
        <span class="user-name" id="navUser"></span>
        <button class="btn btn-ghost btn-sm" id="authBtn" type="button">
          退出
        </button>
      </div>
    </header>

    <main class="page game-page">
      <section class="card stage">
        <div class="info-panel">
          <div>
            当前回合: <span class="highlight" id="turnDisplay">黑棋 (你)</span>
          </div>
          <div>倒计时: <span class="danger" id="timerDisplay">30</span> 秒</div>
        </div>

        <div class="game-container">
          <canvas id="gomokuCanvas" width="600" height="600"></canvas>
        </div>

        <div style="text-align: center; margin-top: 20px">
          <button class="btn btn-ghost" id="undoBtn" disabled>悔棋</button>
          <button class="btn btn-primary" id="restartBtn">重新开始</button>
        </div>
        <p
          class="status-text"
          id="status"
          style="text-align: center; margin-top: 15px"
        >
          你执黑先行。游戏结束会自动记录成绩！
        </p>
      </section>

      <aside class="side">
        <section class="card">
          <h2><span class="dot"></span>我的战绩</h2>
          <div class="record-list">
            <div class="record-line">
              <span>胜场</span
              ><strong id="bestLevel" style="color: #00cc66">-</strong>
            </div>
            <div class="record-line">
              <span>败场</span
              ><strong id="myRank" style="color: #ff4444">-</strong>
            </div>
          </div>
        </section>
      </aside>
    </main>

    <script type="module" src="js/game-page.js"></script>
  </body>
</html>
